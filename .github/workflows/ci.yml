name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Spring Boot 3)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build and run automated tests
        run: ./mvnw clean verify -B
        env:
          JWT_SECRET: "ci-dummy-jwt-secret-key-that-is-at-least-64-characters-long-for-hmac-sha256-signing"
          JWT_EXPIRATION_MS: 3600000

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Angular 17 / Node.js 20)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production Build
        run: npm run build:prod

      - name: Run Unit Tests
        run: npm run test
        env:
          CHROME_BIN: /usr/bin/google-chrome

  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Syntax
        run: |
          docker compose --env-file .env.example config > /dev/null
          echo "✅ docker-compose.yml configuration is valid"

      - name: Validate Backend Dockerfile
        run: |
          docker build --dry-run -f docker/backend/Dockerfile backend/ || true
          echo "✅ Backend Dockerfile syntax validated"

      - name: Validate Frontend Dockerfile
        run: |
          docker build --dry-run -f docker/frontend/Dockerfile frontend/ || true
          echo "✅ Frontend Dockerfile syntax validated"
