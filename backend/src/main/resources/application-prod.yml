spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    com.tcs.invoicefactoring: INFO
    org.springframework.security: WARN
