spring:
  application:
    name: invoice-factoring-backend

  # Datasource (overridden per profile / Docker env vars)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoice_factoring}
    username: ${SPRING_DATASOURCE_USERNAME:app_worker}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_worker_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool-AppWorker
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # CRITICAL: Reset transaction-local RLS context on connection return.
      # app.tenant_id is set with is_local=true, so it auto-resets at tx end.
      # This connection-init-sql enforces the runtime role on every connection.
      connection-init-sql: "SET application_name = 'invoice-factoring-app'"

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Flyway — migrations run as app_owner (schema owner role)
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:app_owner}
    password: ${SPRING_FLYWAY_PASSWORD:change_me_strong_password}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # Security
  security:
    filter:
      order: 1

# JWT configuration (secret loaded from environment — never hardcoded)
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Actuator — expose health only by default; full access restricted in prod
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging defaults (overridden in profile-specific configs)
logging:
  level:
    root: INFO
    com.tcs.invoicefactoring: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
