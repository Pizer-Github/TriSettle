spring:
  application:
    name: invoice-factoring-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoice_factoring}
    username: ${SPRING_DATASOURCE_USERNAME:app_worker}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_worker_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool-AppWorker
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "SET application_name = 'invoice-factoring-app'"

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:app_owner}
    password: ${SPRING_FLYWAY_PASSWORD:change_me_strong_password}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  security:
    filter:
      order: 1

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    bootstrap:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.tcs.invoicefactoring: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
